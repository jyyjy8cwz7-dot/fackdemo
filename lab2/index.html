<script type=module>
import * as THREE from 'three';

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
// ---------- audio (Web Audio, layered) ----------
let AC,master,on=true,pad=null;const buf={};
const files=['bekrafta','whoosh','impact','zap','coin','levelup','pad_neon','pad_aurora','pad_runway'];
const voices=['neon','aurora','runway','arcade','sparat','skickat'];
async function load(p){const r=await fetch(p);return AC.decodeAudioData(await r.arrayBuffer())}
async function initAudio(){AC=new AudioContext();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
 await Promise.all([...files.map(async f=>buf[f]=await load('ljud/'+f+'.mp3')),...voices.map(async v=>buf['v_'+v]=await load('rost/'+v+'.mp3'))])}
function play(n,{v=1,delay=0,rate=1,pan=0}={}){if(!on||!buf[n])return;const s=AC.createBufferSource();s.buffer=buf[n];s.playbackRate.value=rate;const g=AC.createGain();g.gain.value=v;const p=AC.createStereoPanner();p.pan.value=pan;s.connect(g).connect(p).connect(master);s.start(AC.currentTime+delay);return s}
function voice(n,delay=0){if(!on||!buf['v_'+n])return;const s=AC.createBufferSource();s.buffer=buf['v_'+n];
 const duck=pad&&pad.g;if(duck){duck.gain.setTargetAtTime(.08,AC.currentTime+delay,.1);duck.gain.setTargetAtTime(.35,AC.currentTime+delay+s.buffer.duration,.4)}
 const g=AC.createGain();g.gain.value=1.1;s.connect(g).connect(master);s.start(AC.currentTime+delay)}
function setPad(n){if(pad){const o=pad;o.g.gain.setTargetAtTime(0,AC.currentTime,.5);setTimeout(()=>o.s.stop(),2500);pad=null}
 if(!n||!buf[n])return;const s=AC.createBufferSource();s.buffer=buf[n];s.loop=true;s.loopStart=1.5;s.loopEnd=6.5;const g=AC.createGain();g.gain.value=0;s.connect(g).connect(master);s.start();g.gain.setTargetAtTime(on?.35:0,AC.currentTime,1);pad={s,g}}

const cv=document.getElementById('c');const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
const gl=R.getContext(),dbg=gl.getExtension('WEBGL_debug_renderer_info'),GPU=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'';const NOBLOOM=location.search.includes('nobloom')||/swiftshader|llvmpipe|software/i.test(GPU);
R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.8;
let W=innerWidth,H=innerHeight;let scene,cam,comp,tick=()=>{},cur;
function size(){W=innerWidth;H=innerHeight;R.setSize(W,H,false);if(cam){cam.aspect=W/H;cam.updateProjectionMatrix()}comp&&comp.setSize(W,H)}
addEventListener('resize',size);
function mkComp(bloom=1.2,rad=.6,th=.1){if(NOBLOOM){comp=null;return}comp=new EffectComposer(R);comp.addPass(new RenderPass(scene,cam));if(bloom)comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),bloom,rad,th));comp.addPass(new OutputPass());comp.setSize(W,H)}
const toast=(t,c)=>{const e=document.getElementById('toast');e.textContent=t;e.style.color=c;e.style.textShadow=`0 0 20px ${c},0 0 60px ${c}`;gsap.fromTo(e,{opacity:0,scale:.5,y:0},{opacity:1,scale:1,duration:.5,ease:'back.out(2)'});gsap.to(e,{opacity:0,y:-40,delay:1.2,duration:.6})};
function particles(n,colors,spread=3){const g=new THREE.BufferGeometry(),p=new Float32Array(n*3),v=[],c=new Float32Array(n*3);
 for(let i=0;i<n;i++){v.push(new THREE.Vector3((Math.random()-.5),Math.random()*.8+.2,(Math.random()-.5)).normalize().multiplyScalar(Math.random()*spread+1));const col=new THREE.Color(colors[i%colors.length]);c.set([col.r,col.g,col.b],i*3)}
 g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
 const m=new THREE.Points(g,new THREE.PointsMaterial({size:.07,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.userData={v,t:0};return m}
function stepParticles(m,dt,grav=-2.5){m.userData.t+=dt;const a=m.geometry.attributes.position.array;m.userData.v.forEach((v,i)=>{v.y+=grav*dt;a[i*3]+=v.x*dt;a[i*3+1]+=v.y*dt;a[i*3+2]+=v.z*dt});m.geometry.attributes.position.needsUpdate=true;m.material.opacity=Math.max(0,1-m.userData.t/2.2);return m.userData.t<2.4}
let bursts=[];
function burst(pos,colors,n=600,spread=4){const p=particles(n,colors,spread);p.position.copy(pos);scene.add(p);bursts.push(p)}

const T={};
T.neon={h:'NEON//FACKET',s:'Synthwave-motorväg mot framtiden. Bloom, rutnät i shader och laserljud.',l1:'⚡ Spara',l2:'🚀 Skicka',pad:'pad_neon',v:'neon',
 build(){scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x0a0018,.035);cam=new THREE.PerspectiveCamera(70,W/H,.1,200);cam.position.set(0,1.6,6);
  const gm=new THREE.ShaderMaterial({uniforms:{t:{value:0}},transparent:true,vertexShader:'varying vec2 u;void main(){u=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
   fragmentShader:'uniform float t;varying vec2 u;void main(){vec2 g=u*vec2(40.,80.);g.y+=t*4.;vec2 f=abs(fract(g)-.5);float l=smoothstep(.46,.5,max(f.x,f.y));float fade=smoothstep(0.,.6,u.y)*(1.-smoothstep(.85,1.,u.y));vec3 c=mix(vec3(1.,.17,.84),vec3(0.,.94,1.),u.y);gl_FragColor=vec4(c*l*1.3,l*fade);}'});
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(80,160),gm);fl.rotation.x=-Math.PI/2;fl.position.z=-60;scene.add(fl);
  const sun=new THREE.Mesh(new THREE.CircleGeometry(14,64),new THREE.ShaderMaterial({transparent:true,uniforms:{t:{value:0}},vertexShader:'varying vec2 u;void main(){u=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
   fragmentShader:'uniform float t;varying vec2 u;void main(){float s=step(.5,fract(u.y*18.-t*.5))+step(.55,u.y);vec3 c=mix(vec3(1.,.1,.5),vec3(1.,.85,.2),u.y);gl_FragColor=vec4(c*1.05,min(1.,s));}'}));sun.position.set(0,6,-90);scene.add(sun);
  const stars=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(Array.from({length:3000},()=> (Math.random()-.5)*200).map((x,i)=>i%3==1?Math.abs(x)*.5+5:i%3==2?-Math.abs(x)-20:x),3)),new THREE.PointsMaterial({size:.12,color:0x99eeff}));scene.add(stars);
  const shipG=new THREE.Group();const body=new THREE.Mesh(new THREE.ConeGeometry(.35,1.8,4),new THREE.MeshBasicMaterial({color:0x00f0ff,wireframe:true}));body.rotation.x=-Math.PI/2;shipG.add(body);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(2.4,.04,.6),new THREE.MeshBasicMaterial({color:0xff2bd6}));wing.position.z=.3;shipG.add(wing);shipG.position.set(0,.6,0);scene.add(shipG);
  const trail=[];for(let i=0;i<2;i++){const tr=new THREE.Mesh(new THREE.PlaneGeometry(.08,6),new THREE.MeshBasicMaterial({color:i?0xff2bd6:0x00f0ff,transparent:true,opacity:.8}));tr.rotation.x=-Math.PI/2;tr.position.set(i?1.1:-1.1,0,3.5);shipG.add(tr);trail.push(tr)}
  mkComp(.85,.4,.3);let tt=0;
  tick=dt=>{tt+=dt;gm.uniforms.t.value=tt;sun.material.uniforms.t.value=tt;shipG.position.x=Math.sin(tt*.8)*1.2;shipG.rotation.z=-Math.cos(tt*.8)*.4;shipG.position.y=.8+Math.sin(tt*2)*.1;cam.position.x=shipG.position.x*.3;cam.lookAt(0,1,-10)};
  this.ship=shipG},
 a1(){play('zap');play('bekrafta',{delay:.12,v:.8});voice('sparat',.3);buzz([20,30,20]);burst(this.ship.position.clone(),[0x00f0ff,0xff2bd6,0xffffff],700,5);toast('SPARAT','#00f0ff');gsap.fromTo(cam,{fov:70},{fov:85,duration:.15,yoyo:true,repeat:1,onUpdate:()=>cam.updateProjectionMatrix()})},
 a2(){play('whoosh');play('zap',{delay:.5,rate:.7});voice('skickat',.8);buzz([10,20,40,20,80]);const s=this.ship;gsap.to(s.position,{z:-60,y:4,duration:1.2,ease:'power3.in',onComplete:()=>{burst(new THREE.Vector3(0,5,-40),[0xff2bd6,0x00f0ff,0xffec27],1200,12);play('impact',{v:.7});gsap.fromTo(s.position,{z:12,y:.6},{z:0,duration:1,ease:'power3.out'})}});toast('SKICKAT ↗','#ff2bd6')}};

T.aurora={h:'Norrsken',s:'Lugn, levande himmel i en realtids-shader. Kort av frostat glas. Mjuka klockor.',l1:'✨ Spara',l2:'🕊️ Skicka',pad:'pad_aurora',v:'aurora',
 build(){scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(60,W/H,.1,100);cam.position.z=5;
  const m=new THREE.ShaderMaterial({uniforms:{t:{value:0},k:{value:0}},vertexShader:'varying vec2 u;void main(){u=uv;gl_Position=vec4(position.xy*2.,0.,1.);}',
   fragmentShader:`uniform float t;uniform float k;varying vec2 u;
   float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
   float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
   float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<6;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
   void main(){vec2 p=u;vec3 sky=mix(vec3(.01,.02,.08),vec3(.02,.06,.18),p.y);
    float a=0.;for(int i=0;i<3;i++){float fi=float(i);float y=.55+.12*fi+.08*sin(p.x*3.+t*.3+fi)+.1*fbm(vec2(p.x*2.+t*.05,fi));float b=exp(-abs(p.y-y)*(18.-fi*3.))*fbm(vec2(p.x*6.-t*.2,p.y*20.+fi));a+=b;}
    vec3 col=sky+a*mix(vec3(.2,1.,.7),vec3(.6,.3,1.),p.y)*(.55+k*1.2);
    float st=step(.998,h(floor(p*vec2(900.,1600.))))*p.y;col+=st*(.6+.4*sin(t*3.+p.x*50.));
    col+=vec3(.02,.04,.06)*(1.-p.y);gl_FragColor=vec4(col,1.);}`});
  const q=new THREE.Mesh(new THREE.PlaneGeometry(1,1),m);q.frustumCulled=false;scene.add(q);
  const orbs=new THREE.Group();for(let i=0;i<5;i++){const o=new THREE.Mesh(new THREE.SphereGeometry(.4+Math.random()*.4,48,48),new THREE.MeshPhysicalMaterial({color:0xffffff,transmission:1,roughness:.05,thickness:1.2,ior:1.4,iridescence:1,iridescenceIOR:1.3,clearcoat:1}));o.position.set((Math.random()-.5)*4,(Math.random()-.2)*3,-Math.random()*2);o.userData.s=Math.random()*10;orbs.add(o)}
  scene.add(orbs);scene.add(new THREE.AmbientLight(0x88ffdd,.15));const dl=new THREE.DirectionalLight(0xaa88ff,.8);dl.position.set(2,3,4);scene.add(dl);
  const pm=new THREE.PMREMGenerator(R);const es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16),new THREE.MeshBasicMaterial({side:THREE.BackSide,color:0x2a6f8f})));const l1=new THREE.Mesh(new THREE.PlaneGeometry(6,2),new THREE.MeshBasicMaterial({color:0x5effc8}));l1.position.set(0,5,0);l1.rotation.x=Math.PI/2;es.add(l1);scene.environment=pm.fromScene(es).texture;
  mkComp(.35,.5,.7);let tt=0;this.m=m;this.orbs=orbs;
  tick=dt=>{tt+=dt;m.uniforms.t.value=tt;orbs.children.forEach(o=>{o.position.y+=Math.sin(tt+o.userData.s)*.003;o.rotation.y+=dt*.2})}},
 a1(){play('bekrafta');voice('sparat',.25);buzz(25);gsap.fromTo(this.m.uniforms.k,{value:1},{value:0,duration:2.5,ease:'power2.out'});this.orbs.children.forEach((o,i)=>gsap.fromTo(o.scale,{x:1,y:1,z:1},{x:1.3,y:1.3,z:1.3,duration:.4,yoyo:true,repeat:1,delay:i*.06,ease:'sine.inOut'}));toast('Sparat','#5effc8')},
 a2(){play('whoosh',{v:.6});play('bekrafta',{delay:.6,rate:1.25});voice('skickat',.9);buzz([15,40,15]);this.orbs.children.forEach((o,i)=>gsap.to(o.position,{y:'+=6',duration:1.6,delay:i*.08,ease:'power2.in',onComplete:()=>gsap.fromTo(o.position,{y:-4},{y:(Math.random()-.2)*3,duration:1.4,ease:'power2.out'})}));gsap.fromTo(this.m.uniforms.k,{value:.8},{value:0,duration:3});toast('Skickat','#a98bff')}};

T.runway={h:'Bana 01L · Natt',s:'3D-landningsbana i dimma med blinkande ljus. Planet lyfter på riktigt.',l1:'🛬 Spara',l2:'🛫 Skicka',pad:'pad_runway',v:'runway',
 build(){scene=new THREE.Scene();scene.background=new THREE.Color(0x05070d);scene.fog=new THREE.Fog(0x05070d,10,90);cam=new THREE.PerspectiveCamera(55,W/H,.1,300);cam.position.set(-4,2.2,10);
  const rw=new THREE.Mesh(new THREE.PlaneGeometry(10,300),new THREE.MeshStandardMaterial({color:0x14171f,roughness:.9}));rw.rotation.x=-Math.PI/2;rw.position.z=-120;scene.add(rw);
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x070a10}));gnd.rotation.x=-Math.PI/2;gnd.position.y=-.01;scene.add(gnd);
  const cm=new THREE.MeshBasicMaterial({color:0xffffff});for(let z=0;z>-280;z-=8){const d=new THREE.Mesh(new THREE.PlaneGeometry(.25,3),cm);d.rotation.x=-Math.PI/2;d.position.set(0,.01,z);scene.add(d)}
  const N=80,lg=new THREE.SphereGeometry(.09,8,8),edge=new THREE.InstancedMesh(lg,new THREE.MeshBasicMaterial({color:0xffd9a0}),N*2);const mt=new THREE.Matrix4();
  for(let i=0;i<N;i++){mt.setPosition(-5.2,.1,-i*3.5);edge.setMatrixAt(i*2,mt);mt.setPosition(5.2,.1,-i*3.5);edge.setMatrixAt(i*2+1,mt)}scene.add(edge);
  const app=new THREE.InstancedMesh(lg,new THREE.MeshBasicMaterial({color:0xffffff}),20);for(let i=0;i<20;i++){mt.setPosition(0,.15,6+i*2);app.setMatrixAt(i,mt)}scene.add(app);
  const twr=new THREE.Mesh(new THREE.BoxGeometry(.6,.6,.6),new THREE.MeshBasicMaterial({color:0xff2020}));twr.position.set(14,9,-30);scene.add(twr);
  const tw2=new THREE.Mesh(new THREE.CylinderGeometry(.8,1.2,9,12),new THREE.MeshStandardMaterial({color:0x1b2230}));tw2.position.set(14,4.5,-30);scene.add(tw2);
  scene.add(new THREE.HemisphereLight(0x405080,0x000000,.6));
  // plane
  const P=new THREE.Group(),wm=new THREE.MeshStandardMaterial({color:0xe9edf5,metalness:.4,roughness:.35}),am=new THREE.MeshStandardMaterial({color:0xb02a43,metalness:.3,roughness:.4});
  const fus=new THREE.Mesh(new THREE.CapsuleGeometry(.45,4.2,8,24),wm);fus.rotation.x=Math.PI/2;P.add(fus);
  const wg=new THREE.Mesh(new THREE.BoxGeometry(6,.08,1.1),wm);wg.position.set(0,-.1,.2);P.add(wg);
  const ts=new THREE.Mesh(new THREE.BoxGeometry(.08,1.2,.9),am);ts.position.set(0,.7,2.2);P.add(ts);const hs=new THREE.Mesh(new THREE.BoxGeometry(2,.06,.6),wm);hs.position.set(0,.1,2.3);P.add(hs);
  for(const x of[-1.4,1.4]){const en=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.9,16),am);en.rotation.x=Math.PI/2;en.position.set(x,-.35,-.1);P.add(en)}
  const nav=[[-3,0xff2020],[3,0x20ff40]].map(([x,c])=>{const l=new THREE.Mesh(new THREE.SphereGeometry(.07),new THREE.MeshBasicMaterial({color:c}));l.position.set(x,-.1,.2);P.add(l);return l});

  P.position.set(0,.8,0);scene.add(P);this.P=P;

  tick=dt=>{tt+=dt;const b=(Math.sin(tt*6)>.85);twr.visible=Math.sin(tt*2)>0;strobe.visible=b;
   for(let i=0;i<20;i++){const on=Math.floor(tt*12)%20==19-i;mt.setPosition(0,.15,6+i*2);mt.scale(new THREE.Vector3(on?3:1,on?3:1,on?3:1));app.setMatrixAt(i,mt);mt.identity()}app.instanceMatrix.needsUpdate=true;

T.arcade={h:'Insert coin',s:'8-bit med CRT-shader: scanlines, krökt skärm, kromatisk glöd. Chiptune-ljud.',l1:'💾 Spara',l2:'👾 Skicka',v:'arcade',
